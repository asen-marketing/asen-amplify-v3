# Tag vX.Y.Z (matching style.css Version) to publish a release with asen-amplify-v3.zip attached.
# Sites update from that zip via includes/updates.php.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match style.css Version
        run: |
          version=$(sed -n 's/^Version: *//p' style.css | tr -d '\r ')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match style.css Version $version"
            exit 1
          fi

      - name: Build the theme zip (top-level folder asen-amplify-v3/)
        run: git archive --format=zip --prefix=asen-amplify-v3/ -o asen-amplify-v3.zip "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A suffixed tag (v3.1.0-beta.1) is a pre-release and never "latest", so sites don't install it.
        run: |
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease --latest=false" ;; esac
          gh release create "$GITHUB_REF_NAME" asen-amplify-v3.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $extra
